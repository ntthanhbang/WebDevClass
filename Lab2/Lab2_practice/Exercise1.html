<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>IU Survey</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <style>
            body {
                margin: 50px;
            }
            h1 {
                color: darkcyan;
            }

            h3 {
                color: darkcyan;
            }

            .radio {
                display: flex;
                gap: 30px;
            }
            
        </style>
    </head>
    <body>
        <header>
            <img src="/Lab1/logo-vector-IU-01.png" alt="IU logo" style="width: 100px;">
            <h1>Survey</h1>
        </header>
        
        <main>
            <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
            <form>
                <div class="mb-5 w-25">
                    <h3>Your information:</h3>
                    <label for="fname" class="form-label">First name</label>
                    <input type="text" id="fname" name="firstname" class="form-control">
                    <label for="lname" class="form-label">Last name</label>
                    <input type="text" id="lname" name="lastname" class="form-control">
                    <label  for="email" class="form-label">Email</label>
                    <input  type="email" id="email" name="email" class="form-control">
                    <label for="bdate" class="form-label">Date of Birth</label>
                    <input type="date" id="bdate" name="bdate" class="form-control">
                </div>
                
                <div class="mb-5">
                    <h3>How did you hear about us?</h3>
                    <div class="radio">
                        <div class="mb-3 form-check">
                            <input type="radio" class="form-check-input" id="radio1" name="source">
                            <label class="form-check-label" for="radio1">Search engine</label>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="radio" class="form-check-input" id="radio2" name="source">
                            <label class="form-check-label" for="radio2">Word of mouth</label>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="radio" class="form-check-input" id="radio3" name="source">
                            <label class="form-check-label" for="radio3">Social Media</label>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="radio" class="form-check-input" id="radio4" name="source">
                            <label class="form-check-label" for="radio4">Other</label>
                        </div>
                    </div>
                </div>
                
                <div class="mb-5">
                    <h3>Would you like to receive announcements about new CDs and special offers?</h3>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="check1">
                        <label class="form-check-label" for="check1"> YES, I'd like that.</label>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="check2">
                        <label class="form-check-label" for="check2"> YES, please send me email announcements.</label>
                    </div>
                </div>
                
                <div class="mb-5">
                    <label for="contact">Please contact me by:</label>
                    <select class="form-select mb-3 w-25" id="contact" name="Type">
                        <option value="emailorpostalmail">Email or postal mail</option>
                        <option value="email">Email only</option>
                        <option value="postalmail">Postal mail only</option>
                    </select>
                </div>
                
                <div class="mb-5">
                    <button type="submit">Submit</button>
                </div>
                
                <script
                    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                ></script>
            </form>
        </main>
    </body>
</html>
